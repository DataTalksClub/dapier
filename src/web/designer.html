<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Apply the stored theme before first paint; with no stored choice the
       OS preference decides. ?theme= forces one view without persisting.
       Same key and script as the console. */
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('dapier-theme'); } catch (_) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var forced = new URLSearchParams(location.search).get('theme');
      if (forced === 'dark' || forced === 'light') theme = forced;
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>Workflow designer · Dapier</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/designer.css">
  <script defer src="/assets/designer.js"></script>
</head>
<body>
  <div id="designer-root"></div>
</body>
</html>
