# Selected renderer path; original Zapier 153699998 was inactive.
# Migration draft only; enable with its completion consumer during cutover.
id: invoice-body-render
enabled: false
description: Render invoice-pdf email HTML, then route the completed artifact to the owning service.
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice-pdf
actions:
- id: render-pdf
  type: render_html_to_pdf
  input_field: html
  output_key: invoice-body/{event_id}.pdf
  output_bucket_env: RENDER_ARTIFACTS_BUCKET
  pdf:
    page_format: A4
    print_background: true
