# The invoice-pdf address: same turn as invoice-intake's body branch —
# strip the forwarded header, then render the body to PDF. The completion
# flow archives and forwards the artifact.
id: invoice-body-render
enabled: true
description: Render the invoice-pdf email body to PDF with the forwarded
  header stripped, then hand the artifact to the completion flow.
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice-pdf
actions:
- id: strip-forwarded
  type: code
  code: |
    import re

    body = input.get("body") if isinstance(input.get("body"), dict) else {}
    piece = body.get("html")
    if not isinstance(piece, dict):
        piece = {"value": input.get("html") if isinstance(input.get("html"), str) else ""}
    html = str(piece.get("value") or "")
    if not html:
        part = body.get("text") if isinstance(body.get("text"), dict) else {}
        text = str(part.get("value") or "")
        for old, new in (("&", "&amp;"), ("<", "&lt;"), (">", "&gt;")):
            text = text.replace(old, new)
        html = f"<pre>{text}</pre>"
    marker = re.search(r"-{2,}\s*Forwarded message\s*-{2,}", html, flags=re.I)
    stripped = html
    if marker:
        # Walk the header lines that follow the marker (From/Date/Subject/
        # To/..., through tags and whitespace), then cut marker plus
        # headers in one go. Anchored matches keep this linear.
        separator = r"(?:\s|<[^>]*>)*"
        # A header line runs to the end of the line or the next block tag,
        # whichever comes first — addresses like <a@b.c> ride along (they
        # only look like tags).
        line_body = r"(?:[^\n<]|<(?!/?(?:div|p|br)\b)[^>]*>)*"
        header_line = re.compile(
            separator + r"(?:from|date|subject|to|cc|bcc|reply-to)\s*:" + line_body,
            flags=re.I,
        )
        position = marker.end()
        matched = header_line.match(html, position)
        while matched:
            position = matched.end()
            matched = header_line.match(html, position)
        # Drop the marker's own now-empty wrapper tags: bare closing tags
        # ahead of the cut, then the header block's closers behind it.
        prefix = re.sub(r"(?:<[^>]*>|\s)*$", "", html[:marker.start()])
        boundary = re.match(r"(?:</(?:div|p)>|\s)*", html[position:])
        stripped = prefix + html[position + boundary.end():]
    output = {"html": stripped.strip(), "forwarded_header_removed": marker is not None}
  tests:
  - name: the forwarded header block goes, the receipt stays
    input:
      body:
        html:
          value: "<div>---------- Forwarded message ----------</div><div>From: Google
            Play <googleplay-noreply@google.com></div><div>Date: Fri, Oct 2, 2026,
            08:56</div><div>Subject: Your Google Play Order Receipt from Oct 2,
            2026</div><div>To: <alexey.s.grigoriev@gmail.com></div><div><table><tr><td>Order
            total: 0.99 EUR</td></tr></table></div>"
    expected:
      html: "<div><table><tr><td>Order total: 0.99 EUR</td></tr></table></div>"
      forwarded_header_removed: true
  - name: a plaintext forward keeps only the body
    input:
      body:
        html:
          value: "---------- Forwarded message ----------\nFrom: a@b.c\nDate:
            today\nSubject: Receipt\nTo: d@e.f\n\nOrder total: 42 EUR\n"
    expected:
      html: "Order total: 42 EUR"
      forwarded_header_removed: true
  - name: no marker leaves the body alone
    input:
      body:
        html:
          value: <p>Receipt</p>
    expected:
      html: <p>Receipt</p>
      forwarded_header_removed: false
- id: render-pdf
  type: render_html_to_pdf
  input_field: html
  input_value: '{steps.strip-forwarded.output.result.html}'
  output_key: invoice-body/{event_id}.pdf
  output_bucket_env: RENDER_ARTIFACTS_BUCKET
  pdf:
    page_format: A4
    print_background: true
