# Newsletter sponsor extraction (live).
#
# Follow the invoice-intake pattern (workflows/invoice-intake.yaml): Dapier
# transports, extracts and forwards; DataOps owns the contents. This flow
# reads paid sponsor placements from newsletter emails with one LLM call and
# forwards the normalized payload to the DataOps sponsors-leads intake
# (POST /api/v1/intake/leads, contract 2026-10-10). Nothing is stored in
# Dapier: no sponsor store, no ledger, no review queue.
#
# Live state: enabled. The DataOps connection carries the API origin and the
# intake secret lives at dapier.dataops; the LLM runs on the `llm`
# connection (model claude-sonnet-5-5). This file mirrors the live
# definition — change it through save/publish, then sync here.
id: newsletter-sponsors
enabled: true
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: newsletter
actions:
- id: extract-sponsors
  type: ai_complete
  connection_id: llm
  # json_schema constrains the reply to this shape (implies JSON mode) and
  # validates it: an unparsable reply or a schema mismatch returns
  # {ok: false, error, text} for the chain to branch on instead of failing
  # the step (src/dapier/connectors/ai.py). Field names match the DataOps
  # intake (blurb/context), so the forward step passes them through.
  # category is optional: gold labels omit it, and requiring it forces the
  # model to invent one.
  model: claude-sonnet-5-5
  prompt: |
    Extract the newsletter identity and its paid sponsor placements from the
    email below. Read the entire email — intro, mid-roll, close, and footer
    slots. Paid placements only.

    Include a mention ONLY when a third party paid for that slot: a block
    labeled sponsored / partner / paid / advertisement / affiliate; an
    asterisk native placement (* or *sponsored); "Brought to you by";
    "FROM OUR PARTNERS"; a Sponsors heading; "Our Premier Partner"; a
    "Sponsor Message" or "A MESSAGE FROM <third party>" card; a mid-roll
    ad; or a course/series-sponsor thanks to a third party. A hiring ad
    counts only when it sits in one of those paid slots.

    Exclude everything else. Never list editorial article links, author
    bios, social icons, unsubscribe or compliance links, "sponsor this newsletter"
    CTAs, the newsletter's own job board, or the publisher promoting their
    own book, course, product, event, or community (self-promo is not a
    sponsor, even with a heading or CTA). Do not glue a nearby editorial
    URL onto a sponsor name. When in doubt, omit — an empty sponsors array
    is the correct answer when the issue has no paid placements.

    Name the company, not the campaign title, when the company is visible.
    url must be https and the sponsor's own site; omit url when unknown,
    http-only, mailto, a substack.com/redirect, or a tracking host. Copy each url verbatim from
    the email body — never compose, guess, or autocomplete one from field
    names, placeholders, or the sponsor's homepage.
    Omit empty url, blurb, and context. At most 20 sponsors; dedup on
    name+url. category is optional (tool, product, service, event, course,
    book, job, community, other) — omit it rather than guess.
    newsletter is the newsletter's name.

    From: {sender}
    Subject: {subject}
    Text:
    {text}
    {body.text.value}
    HTML:
    {html.value}
    {html}
  system: You extract paid newsletter sponsor placements only. Reply as a JSON object only, no fences. Empty sponsors is valid.
  json_schema:
    type: object
    required: [newsletter, sponsors]
    properties:
      newsletter:
        type: string
      sponsors:
        type: array
        items:
          type: object
          required: [name]
          properties:
            name:
              type: string
            url:
              type: string
            category:
              type: string
              enum: [tool, product, service, event, course, book, job, community, other]
            blurb:
              type: string
            context:
              type: string
  # No temperature: newer Claude models reject the field outright, and the
  # provider default applies when it is omitted.
- id: forward-leads
  type: dataops
  # Posts the 2026-10-10 sponsors-leads envelope built by
  # engine.actions.dataops._leads_intake_body from this event plus the
  # extraction above: messageId/sender/subject/date from the email,
  # newsletter name and sponsors from steps.extract-sponsors.output.data.
  # The builder forwards sponsors unchanged. DataOps owns URL/whitespace
  # cleansing, hallucinated URL removal, within-email dedup and the 20-cap.
  # Same auth as the invoice intake: the dapier.dataops secret lands in
  # x-dataops-intake-secret. An issue with no forwardable sponsors posts
  # sponsors: [] so DataOps records it as checked; a real failure fails the run.
  connection_id: dataops
  auth_secret_id: dapier.dataops
  extraction_step: extract-sponsors
