# Newsletter sponsor extraction (example — disabled).
#
# Follow the invoice-intake pattern (workflows/invoice-intake.yaml): Dapier
# transports, extracts and forwards; DataOps owns the contents. This flow
# reads paid sponsor mentions from newsletter emails with one LLM call and
# forwards the normalized payload to the DataOps sponsors-leads intake
# (POST /api/v1/intake/leads, contract 2026-10-10). Nothing is stored in
# Dapier: no sponsor store, no ledger, no review queue.
#
# Status: example only (`enabled: false`). Before enabling, set
# DATAOPS_LEADS_URL on the Worker (template.yaml snippet in
# docs/newsletter-sponsors.md), confirm the intake secret, and configure the
# LLM_* env (docs/connectors/ai.md — Anthropic's OpenAI-compatible API with
# model claude-sonnet-5-5; prefer a workspace-scoped key).
id: newsletter-sponsors
enabled: false
description: 'Newsletter emails: extract paid sponsor mentions with one LLM call
  and forward them to the DataOps sponsors-leads intake. Transport only — no
  sponsor store in Dapier.'
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: newsletter
actions:
- id: extract-sponsors
  type: ai_complete
  # json_schema constrains the reply to this shape (implies JSON mode) and
  # validates it: an unparsable reply or a schema mismatch returns
  # {ok: false, error, text} for the chain to branch on instead of failing
  # the step (src/dapier/connectors/ai.py). Field names match the DataOps
  # intake (blurb/context), so the forward step passes them through.
  model: claude-sonnet-5-5
  prompt: |
    Extract the newsletter identity and its paid sponsor/advertiser mentions
    from the email below. Sponsors are paid placements only — never editorial
    links, author bios, social icons, or footer/unsubscribe links. An empty
    sponsors array is valid when the issue has no sponsors. Url is the link
    the sponsor promotes (the sponsor's own page or offer, never the
    newsletter homepage or an unsubscribe link). Category is the kind of
    promotion: tool, product, service, event, course, book, job, community,
    or other. Blurb is a short description of the sponsor; context is
    where/how the mention appeared.

    Subject: {subject}
    Body:
    {body}
  system: You extract newsletter sponsor mentions. Reply as a JSON object only, no fences.
  json_schema:
    type: object
    required: [newsletter, sponsors]
    properties:
      newsletter:
        type: string
      sponsors:
        type: array
        items:
          type: object
          required: [name, category]
          properties:
            name:
              type: string
            url:
              type: string
            category:
              type: string
              enum: [tool, product, service, event, course, book, job, community, other]
            blurb:
              type: string
            context:
              type: string
  # No temperature: newer Claude models reject the field outright, and the
  # provider default applies when it is omitted.
- id: forward-leads
  type: dataops
  # Posts the 2026-10-10 sponsors-leads envelope built by
  # engine.actions.dataops._leads_intake_body from this event plus the
  # extraction above: messageId/sender/subject/date from the email,
  # newsletter name and sponsors from steps.extract-sponsors.output.data.
  # Normalization (trim, https-only URLs, within-email dedup, 20-cap) lives
  # in that builder — no code step needed (code steps see event data only).
  # Same auth as the invoice intake: the dapier/dataops secret lands in
  # x-dataops-intake-secret. on_fail: continue skips issues whose
  # extraction found no forwardable sponsors instead of failing the run.
  auth_secret_id: dapier/dataops
  url_env: DATAOPS_LEADS_URL
  extraction_step: extract-sponsors
  on_fail: continue
