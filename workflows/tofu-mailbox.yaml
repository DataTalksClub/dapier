id: tofu-mailbox
enabled: true
description: Built-in mailbox tofu@dtcdev.click + webhook /hooks/webhook/tofu -> Hub tofu via worker
triggers:
  - connector: email
    event: message.received
    filters:
      route:
        equals: tofu
  - connector: webhook
    event: request.received
    filters:
      hook:
        equals: tofu
actions:
  - id: notify-hub
    type: agent
    engine: claude
    notify_from: agents@dtcdev.click
    prompt: |
      File ONE Hub intake task for project tofu using hub CLI on this machine.

      Write a text file then create:
        hub intake create --project tofu --title "TITLE" --text-file /tmp/dapier-tofu-intake.txt --source-type forwarded --source-reference "dapier:tofu" --key "KEY"

      TITLE: "tofu@ / webhook: {subject}{body.subject}"
      KEY: prefer non-empty of {message_id}{body.message_id}; else "tofu-{hook}-{trigger.event_id}"

      Put this in the text file:
      Subject: {subject}{body.subject}
      From: {from}{body.from}
      Message-ID: {message_id}{body.message_id}
      Hook: {hook}
      Route: {route}
      Text: {text}{body.text}
      Email body: {body.text.value}

      Do not ask questions. Report the Hub task id and stop.
