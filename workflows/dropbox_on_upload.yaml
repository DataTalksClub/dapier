id: dropbox_on_upload
enabled: true
trigger:
  connector: dropbox
  event: file.created
  filters:
    path:
      prefix: /_dtc_paperwork/income-invoices/
actions:
  - id: intake-invoice
    type: dataops
    connection_id: dropbox
    url_env: DATAOPS_INTAKE_URL
    auth_secret_id: dapier/dataops
  - id: delete-processed-file
    type: dropbox_delete
    connection_id: dropbox
