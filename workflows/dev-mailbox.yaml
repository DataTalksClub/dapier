id: dev-mailbox
enabled: true
description: Developer mailbox dev@dtcdev.click -> direct oncall ingest always; Developer bot webhook (or Dev sticky Hub session when GrokBot remaining usage < 1%) only for [principal-ping] mail and explicit user-facing outage alerts
# A failed delivery leg (Hub briefly unreachable) retries as a fresh queue
# message two minutes later. Without a policy the event waits out the event
# queue's 900s visibility timeout per redelivery, which trips the 900s
# EventQueueAgeAlarm on every transient outage.
retry:
  attempts: 4
  backoff_seconds: 120
triggers:
  - connector: email
    event: message.received
    filters:
      route:
        equals: dev
  - connector: webhook
    event: request.received
    filters:
      hook:
        equals: dev
actions:
  - id: get-url
    type: storage_get
    key: webhook_url
    secret: true
  - id: get-token
    type: storage_get
    key: webhook_token
  - id: get-oncall-url
    type: storage_get
    key: oncall_webhook_url
    secret: true
  - id: get-oncall-token
    type: storage_get
    key: oncall_webhook_token
    secret: true
  - id: get-hub-usage-url
    type: storage_get
    key: hub_usage_url
  - id: get-hub-messages-url
    type: storage_get
    key: hub_messages_url
  - id: get-hub-api-token
    type: storage_get
    key: hub_api_token
    secret: true
  - id: get-hub-recipient
    type: storage_get
    key: hub_recipient
  - id: get-hub-refresh-url
    type: storage_get
    key: hub_refresh_url
  - id: get-hub-refresh-token
    type: storage_get
    key: hub_refresh_token
    secret: true
  - id: format-email
    type: code
    code: |
      # The Developer bot webhook URL/token live in this workflow's storage
      # (keys webhook_url / webhook_token, set once by the operator). A
      # storage_get for a never-provisioned key returns an empty value, and
      # POSTing to an empty URL would fail every dev@ email through five
      # queue redeliveries into the dead-letter queue. Fail here instead,
      # naming the missing keys, so the failure notice says what to fix.
      if isinstance(steps, dict):
          _missing_keys = []
          for _step_id, _key in (("get-url", "webhook_url"), ("get-token", "webhook_token")):
              if _step_id in steps:
                  _output = ((steps.get(_step_id) or {}).get("output") or {})
                  if not str(_output.get("value") or "").strip():
                      _missing_keys.append(_key)
          if _missing_keys:
              raise ValueError(
                  "dev-mailbox is not configured: storage key(s) "
                  + ", ".join(_missing_keys)
                  + " are empty. Set them with: dapier storage set"
                    " dev-mailbox <name> <value>"
              )
          _url_output = ((steps.get("get-url") or {}).get("output") or {})
          _webhook_url = str(_url_output.get("value") or "").strip()
          if _webhook_url and not _webhook_url.lower().startswith(("http://", "https://")):
              raise ValueError(
                  "dev-mailbox is misconfigured: storage key webhook_url must be "
                  "an http:// or https:// URL (check that webhook_url and "
                  "webhook_token are not swapped). Correct it with: dapier storage "
                  "set dev-mailbox webhook_url <http(s)-URL>"
              )

      sender = input.get("sender") or {}
      from_addr = input.get("from") or (sender.get("header") if isinstance(sender, dict) else str(sender))

      recipients = input.get("recipients") or {}
      to_addr = input.get("to") or (recipients.get("to") if isinstance(recipients, dict) else "")
      if not to_addr and isinstance(recipients, dict) and recipients.get("addresses"):
          to_addr = recipients["addresses"][0]
      if not to_addr:
          to_addr = input.get("route_address") or "dev@dtcdev.click"

      hook_body = input.get("body") if isinstance(input.get("body"), dict) else {}
      if not from_addr and hook_body.get("from"):
          from_addr = hook_body.get("from")
      if not to_addr and hook_body.get("to"):
          to_addr = hook_body.get("to")

      subject = input.get("subject") or hook_body.get("subject") or ""
      date = input.get("date") or hook_body.get("date") or ""
      message_id = input.get("message_id") or hook_body.get("message_id") or ""

      body = input.get("body") or {}
      text = ""
      if isinstance(body, dict):
          t = body.get("text")
          if isinstance(t, dict):
              text = t.get("value") or t.get("text") or ""
          elif isinstance(t, str):
              text = t
      if not text and isinstance(input.get("text"), str):
          text = input.get("text")
      elif not text and isinstance(input.get("text"), dict):
          text = input.get("text").get("value") or input.get("text").get("text") or ""
      if not text and hook_body.get("text"):
          text = str(hook_body.get("text"))

      snippet = " ".join(str(text).split())
      snippet = snippet[:200]

      attachments = []
      for att in (input.get("attachments") or hook_body.get("attachments") or []):
          if isinstance(att, dict):
              meta = {
                  "filename": att.get("filename") or "attachment",
                  "content_type": att.get("content_type") or "application/octet-stream",
                  "size": att.get("size") or 0,
              }
              if att.get("checksum"):
                  meta["checksum"] = att["checksum"]
              if att.get("content_id"):
                  meta["content_id"] = att["content_id"]
              attachments.append(meta)

      output = {
          "from": from_addr,
          "to": to_addr,
          "subject": subject,
          "snippet": snippet,
          "date": date,
          "message_id": message_id,
          "message-id": message_id,
          "text": text,
          "text_body": text,
          "attachments": attachments,
      }
  - id: classify-email
    type: code
    code: |
      # Classify the mail into delivery buckets. Wake the Developer (Grok)
      # bot webhook only for Hub principal-pings and alerts that explicitly
      # say prod is down for users (user-facing outage); everything else is
      # routine and rides the direct oncall ingest only — infra/CMP
      # workers/release follower/poller alerts, deadman FAIL/RECOVERED,
      # telegram relay heartbeats, disk WARN, GitHub Actions failures,
      # digests, dapier failure notices, and ordinary human mail included.
      # The outage markers are deliberately narrow and explicit: a false
      # "wake" pages the Developer bot, while a false "routine" still
      # reaches oncall through the ingest.
      payload = ((steps.get("format-email") or {}).get("output") or {}).get("result") or {}
      subject = str(payload.get("subject") or "")
      text = str(payload.get("text") or "")[:4000]
      lowered_subject = subject.lower()

      if "[principal-ping]" in lowered_subject:
          output = {"wake": True, "reason": "principal_ping"}
      else:
          markers = (
              "prod is down",
              "production is down",
              "prod down",
              "production down",
              "site is down",
              "site down",
              "website is down",
              "down for users",
              "user-facing outage",
              "[user-facing]",
              "[outage]",
          )
          haystack = (subject + "\n" + text).lower()
          hit = ""
          for marker in markers:
              if marker in haystack:
                  hit = marker
                  break
          if hit:
              output = {"wake": True, "reason": "user_facing_outage:" + hit}
          else:
              output = {"wake": False, "reason": "routine_alert"}
  - id: oncall-delivery-id
    type: code
    code: |
      import hashlib
      import json

      _payload = ((steps.get("format-email") or {}).get("output") or {}).get("result") or {}
      _identity = str(_payload.get("message_id") or "").strip()
      if not _identity:
          _identity = json.dumps(_payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
      output = hashlib.sha256(_identity.encode("utf-8")).hexdigest()
  - id: post-oncall-ingest
    type: http_request
    method: POST
    url: "{steps.get-oncall-url.output.value}"
    auth_type: bearer
    auth_token: "{steps.get-oncall-token.output.value}"
    headers:
      X-Delivery-Id: "{steps.oncall-delivery-id.output.result}"
    content_type: application/json
    body: "{steps.format-email.output.result}"
    on_error: continue
  - id: grok-fallback-armed
    type: condition
    when:
      steps.get-hub-usage-url.output.value:
        prefix: "http"
      steps.get-hub-messages-url.output.value:
        prefix: "http"
      steps.get-hub-api-token.output.value:
        exists: true
      steps.get-hub-recipient.output.value:
        exists: true
      steps.get-hub-refresh-url.output.value:
        prefix: "http"
      steps.get-hub-refresh-token.output.value:
        exists: true
    then:
      - id: check-grokbot-usage
        type: http_request
        method: GET
        url: "{steps.get-hub-usage-url.output.value}"
        auth_type: bearer
        auth_token: "{steps.get-hub-api-token.output.value}"
        on_fail: continue
    else: []
  - id: decide-grok-route
    type: code
    code: |
      # Route the formatted email. The direct oncall ingest is the primary
      # delivery for every event. The Developer (Grok) bot webhook is woken
      # only when the classifier flagged the mail (Hub principal-ping or an
      # explicit user-facing outage) — via the webhook by default, or via
      # the Dev role's sticky Hub session (named agent recipient via Hub's
      # POST /api/messages) when Hub's GrokBot usage export reports
      # below_threshold on fresh evidence. When the oncall ingest failed
      # (and is not the 409 already-delivered duplicate), fall back to the
      # webhook regardless of classification: the mail must never be
      # silently dropped; verify-delivery still fails the run so Dapier
      # retries the event and the failure notice reaches dev@. Fail-safe:
      # missing hub config or a skipped/failed usage check keeps the
      # historical webhook delivery for wake events, so a Hub outage or a
      # half-provisioned fallback can never divert mailbox mail into the
      # void. The direct oncall ingest above is independent of this route
      # and always runs.
      def _out(step_id):
          return ((steps.get(step_id) or {}).get("output") or {})

      classification = _out("classify-email").get("result") or {}
      wake = classification.get("wake") is True

      usage_url = str(_out("get-hub-usage-url").get("value") or "").strip()
      messages_url = str(_out("get-hub-messages-url").get("value") or "").strip()
      recipient = str(_out("get-hub-recipient").get("value") or "").strip()
      # The usage check runs inside the armed condition's then-branch,
      # so its run-history id nests under that branch.
      check = steps.get("grok-fallback-armed.then.check-grokbot-usage") or {}

      ingest = steps.get("post-oncall-ingest") or {}
      ingest_duplicate = (ingest.get("status") == "failed"
                          and "HTTP 409" in str(ingest.get("error") or ""))
      ingest_failed = ingest.get("status") != "completed" and not ingest_duplicate

      route = "webhook"
      reason = "routine_oncall_only"
      if ingest_failed:
          reason = "oncall_ingest_failed_fallback"
      elif not wake:
          route = "none"
          reason = "routine_oncall_only:" + str(classification.get("reason") or "unclassified")
      elif not (usage_url and messages_url and recipient):
          reason = "hub_fallback_not_configured"
      elif check.get("status") != "completed":
          reason = "grokbot_usage_unavailable"
      else:
          data = check.get("output") or {}
          data = data.get("body") if isinstance(data.get("body"), dict) else {}
          fresh = data.get("fresh") is True
          if data.get("below_threshold") is True and fresh:
              route = "hub_session"
              reason = "grokbot_below_threshold"
          elif not fresh:
              reason = "grokbot_usage_not_fresh"
          else:
              reason = "grokbot_above_threshold"
      # An HTTP 401 from the usage check means the stored Hub bearer
      # expired (they rotate hourly). Report it so the rotate branch can
      # trade the stored refresh token for a fresh pair; this run still
      # delivers via the webhook (fail-safe) and the next email uses the
      # fresh token. Routine-only events never touch Hub, so no rotation.
      expired = (wake and not ingest_failed
                 and check.get("status") == "skipped"
                 and "HTTP 401" in str(check.get("error") or ""))
      output = {
          "route": route,
          "reason": reason,
          "recipient": recipient if route == "hub_session" else "",
          "refresh_needed": expired,
      }
  - id: hub-token-rotate
    type: condition
    when:
      steps.decide-grok-route.output.result.refresh_needed:
        equals: true
    then:
      - id: refresh-hub-token
        type: http_request
        method: POST
        url: "{steps.get-hub-refresh-url.output.value}"
        content_type: application/json
        body: '{"grant_type": "refresh_token", "refresh_token": "{steps.get-hub-refresh-token.output.value}"}'
        on_fail: continue
      - id: store-hub-tokens
        type: condition
        when:
          steps.hub-token-rotate.then.refresh-hub-token.output.body.access_token:
            exists: true
        then:
          - id: store-hub-api-token
            type: storage_set
            key: hub_api_token
            value: "{steps.hub-token-rotate.then.refresh-hub-token.output.body.access_token}"
          - id: store-hub-refresh-token
            type: storage_set
            key: hub_refresh_token
            value: "{steps.hub-token-rotate.then.refresh-hub-token.output.body.refresh_token}"
        else: []
    else: []
  - id: route
    type: condition
    when:
      steps.decide-grok-route.output.result.route:
        equals: hub_session
    then:
      - id: notify-hub-session
        type: http_request
        method: POST
        url: "{steps.get-hub-messages-url.output.value}"
        auth_type: bearer
        auth_token: "{steps.get-hub-api-token.output.value}"
        content_type: application/json
        body: '{"recipient": "{steps.get-hub-recipient.output.value}", "body": "Hey, check your emails.", "key": "dapier-dev-{steps.oncall-delivery-id.output.result}"}'
    else:
      - id: wake-webhook
        type: condition
        when:
          steps.decide-grok-route.output.result.route:
            equals: webhook
        then:
          - id: post-webhook
            type: http_request
            method: POST
            url: "{steps.get-url.output.value}"
            auth_type: bearer
            auth_token: "{steps.get-token.output.value}"
            content_type: application/json
            body: "{steps.format-email.output.result}"
            on_error: continue
        else: []
  - id: verify-delivery
    type: code
    code: |
      # Every event must land in the direct oncall ingest; events the
      # classifier woke additionally land in the routed leg (the Developer
      # webhook, or the Dev role's sticky Hub session when GrokBot usage
      # was below threshold). Any leg that did not complete fails the run
      # so Dapier retries the event — and once retries are exhausted, the
      # failure notice reaches dev@. A webhook fired only as the ingest
      # fallback (route=webhook with reason oncall_ingest_failed_fallback)
      # does not mask the ingest failure: the ingest leg is still required
      # here, so the run stays loud.
      route_output = ((steps.get("route") or {}).get("output") or {})
      decide = ((steps.get("decide-grok-route") or {}).get("output") or {}).get("result") or {}
      route = str(decide.get("route") or "")
      leg = {"hub_session": "route.then.notify-hub-session",
             "webhook": "route.else.wake-webhook.then.post-webhook"}.get(route)
      failed = []
      if route not in ("hub_session", "webhook", "none"):
          failed.append("decide-grok-route")
      elif leg is not None and (steps.get(leg) or {}).get("status") != "completed":
          failed.append(leg)
      # Hub answers 409 delivery_id_conflict when it already holds a
      # delivery under this X-Delivery-Id (sha256 of the message id) and the
      # body digest differs. That happens on a retry: the first attempt
      # reached Hub but its response timed out, and the retry resends the
      # format-email output recovered from run history, whose key order is
      # not preserved. The email is already in Hub's queue, so it counts.
      ingest = steps.get("post-oncall-ingest") or {}
      ingest_duplicate = (ingest.get("status") == "failed"
                          and "HTTP 409" in str(ingest.get("error") or ""))
      if ingest.get("status") != "completed" and not ingest_duplicate:
          failed.append("post-oncall-ingest")
      if failed:
          raise ValueError("dev-mailbox delivery failed for: " + ", ".join(failed))
      output = {"routed_to": route,
                "decide_reason": str(decide.get("reason") or ""),
                "oncall_ingest": "already_delivered" if ingest_duplicate else "completed"}

