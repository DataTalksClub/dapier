id: dev-mailbox
enabled: true
description: Developer mailbox dev@dtcdev.click -> Developer bot webhook + direct oncall ingest
triggers:
  - connector: email
    event: message.received
    filters:
      route:
        equals: dev
  - connector: webhook
    event: request.received
    filters:
      hook:
        equals: dev
actions:
  - id: get-url
    type: storage_get
    key: webhook_url
    secret: true
  - id: get-token
    type: storage_get
    key: webhook_token
  - id: get-oncall-url
    type: storage_get
    key: oncall_webhook_url
    secret: true
  - id: get-oncall-token
    type: storage_get
    key: oncall_webhook_token
    secret: true
  - id: format-email
    type: code
    code: |
      # The Developer bot webhook URL/token live in this workflow's storage
      # (keys webhook_url / webhook_token, set once by the operator). A
      # storage_get for a never-provisioned key returns an empty value, and
      # POSTing to an empty URL would fail every dev@ email through five
      # queue redeliveries into the dead-letter queue. Fail here instead,
      # naming the missing keys, so the failure notice says what to fix.
      if isinstance(steps, dict):
          _missing_keys = []
          for _step_id, _key in (("get-url", "webhook_url"), ("get-token", "webhook_token")):
              if _step_id in steps:
                  _output = ((steps.get(_step_id) or {}).get("output") or {})
                  if not str(_output.get("value") or "").strip():
                      _missing_keys.append(_key)
          if _missing_keys:
              raise ValueError(
                  "dev-mailbox is not configured: storage key(s) "
                  + ", ".join(_missing_keys)
                  + " are empty. Set them with: dapier storage set"
                    " dev-mailbox <name> <value>"
              )
          _url_output = ((steps.get("get-url") or {}).get("output") or {})
          _webhook_url = str(_url_output.get("value") or "").strip()
          if _webhook_url and not _webhook_url.lower().startswith(("http://", "https://")):
              raise ValueError(
                  "dev-mailbox is misconfigured: storage key webhook_url must be "
                  "an http:// or https:// URL (check that webhook_url and "
                  "webhook_token are not swapped). Correct it with: dapier storage "
                  "set dev-mailbox webhook_url <http(s)-URL>"
              )

      sender = input.get("sender") or {}
      from_addr = input.get("from") or (sender.get("header") if isinstance(sender, dict) else str(sender))

      recipients = input.get("recipients") or {}
      to_addr = input.get("to") or (recipients.get("to") if isinstance(recipients, dict) else "")
      if not to_addr and isinstance(recipients, dict) and recipients.get("addresses"):
          to_addr = recipients["addresses"][0]
      if not to_addr:
          to_addr = input.get("route_address") or "dev@dtcdev.click"

      hook_body = input.get("body") if isinstance(input.get("body"), dict) else {}
      if not from_addr and hook_body.get("from"):
          from_addr = hook_body.get("from")
      if not to_addr and hook_body.get("to"):
          to_addr = hook_body.get("to")

      subject = input.get("subject") or hook_body.get("subject") or ""
      date = input.get("date") or hook_body.get("date") or ""
      message_id = input.get("message_id") or hook_body.get("message_id") or ""

      body = input.get("body") or {}
      text = ""
      if isinstance(body, dict):
          t = body.get("text")
          if isinstance(t, dict):
              text = t.get("value") or t.get("text") or ""
          elif isinstance(t, str):
              text = t
      if not text and isinstance(input.get("text"), str):
          text = input.get("text")
      elif not text and isinstance(input.get("text"), dict):
          text = input.get("text").get("value") or input.get("text").get("text") or ""
      if not text and hook_body.get("text"):
          text = str(hook_body.get("text"))

      snippet = " ".join(str(text).split())
      snippet = snippet[:200]

      attachments = []
      for att in (input.get("attachments") or hook_body.get("attachments") or []):
          if isinstance(att, dict):
              meta = {
                  "filename": att.get("filename") or "attachment",
                  "content_type": att.get("content_type") or "application/octet-stream",
                  "size": att.get("size") or 0,
              }
              if att.get("checksum"):
                  meta["checksum"] = att["checksum"]
              if att.get("content_id"):
                  meta["content_id"] = att["content_id"]
              attachments.append(meta)

      output = {
          "from": from_addr,
          "to": to_addr,
          "subject": subject,
          "snippet": snippet,
          "date": date,
          "message_id": message_id,
          "message-id": message_id,
          "text": text,
          "text_body": text,
          "attachments": attachments,
      }
  - id: oncall-delivery-id
    type: code
    code: |
      import hashlib
      import json

      _payload = ((steps.get("format-email") or {}).get("output") or {}).get("result") or {}
      _identity = str(_payload.get("message_id") or "").strip()
      if not _identity:
          _identity = json.dumps(_payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
      output = hashlib.sha256(_identity.encode("utf-8")).hexdigest()
  - id: post-webhook
    type: http_request
    method: POST
    url: "{steps.get-url.output.value}"
    auth_type: bearer
    auth_token: "{steps.get-token.output.value}"
    content_type: application/json
    body: "{steps.format-email.output.result}"
    on_error: continue
  - id: post-oncall-ingest
    type: http_request
    method: POST
    url: "{steps.get-oncall-url.output.value}"
    auth_type: bearer
    auth_token: "{steps.get-oncall-token.output.value}"
    headers:
      X-Delivery-Id: "{steps.oncall-delivery-id.output.result}"
    content_type: application/json
    body: "{steps.format-email.output.result}"
    on_error: continue
  - id: verify-both-deliveries
    type: code
    code: |
      failed = []
      for step_id in ("post-webhook", "post-oncall-ingest"):
          step = steps.get(step_id) or {}
          if step.get("status") != "completed":
              failed.append(step_id)
      if failed:
          raise ValueError("dev-mailbox delivery failed for: " + ", ".join(failed))
      output = {"developer_webhook": "completed", "oncall_ingest": "completed"}
