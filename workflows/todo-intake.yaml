# Migration draft; save through dapier workflows save.
id: todo-intake
enabled: false
description: 'Email tasks use processing time; retain native Telegram
  tasks and confirmations.'
actions:
- id: native-text
  type: code
  code: 'text = input.get(''text'')

    task = text.replace(''/todo '', '''').strip() if isinstance(text, str) else ''''

    output = {''has_text'': bool(task and task != ''/todo'')}'
- id: append-task
  type: condition
  when:
    hook:
      equals: todo
  then:
  - id: nonempty-task
    type: condition
    when:
      steps.native-text.output.result.has_text:
        equals: true
    then:
    - id: append-row
      type: sheets_append_row
      connection_id: google-sheets
      spreadsheet_id: 1xdeCQOLRS4vodv3GjaXNaC6t63-qdqL3X98KqJFs0dw
      sheet_id: 0
      sheet_name: todo
      value_input_option: USER_ENTERED
      values:
      - - '{trigger.occurred_at|date_format:%Y-%m-%d}'
        - '{text|replace:/todo :|trim}'
        - ''
        - NEW
  else:
  - id: processing-time
    type: date_time
    timezone: Etc/GMT+6
  - id: email-fields
    type: code
    code: 'sender = input.get(''sender'') or {}

      output = {''from'': input.get(''from'') or (sender.get(''header'', '''') if
      isinstance(sender, dict) else str(sender))}'
  - id: append-row
    type: sheets_append_row
    connection_id: google-sheets
    spreadsheet_id: 1xdeCQOLRS4vodv3GjaXNaC6t63-qdqL3X98KqJFs0dw
    sheet_id: 0
    sheet_name: todo
    value_input_option: USER_ENTERED
    values:
    - - '{steps.append-task.else.processing-time.output.iso}'
      - Process email "{subject}" from {steps.append-task.else.email-fields.output.result.from}
      - ''
      - NEW
- id: forward-email
  type: condition
  when:
    route:
      equals: todo
  then:
  - id: create-intake
    type: dataops
    auth_secret_id: dapier/dataops
    url_env: DATAOPS_INTAKE_URL
- id: confirm-telegram
  type: condition
  when:
    hook:
      equals: todo
    steps.native-text.output.result.has_text:
      equals: true
  then:
  - id: confirm
    type: telegram_send
    connection_id: telegram-bot
    text: Done! Saved "{text|replace:/todo :|trim}" to the todo list.
triggers:
- connector: email
  event: message.received
  filters:
    route:
      equals: todo
- connector: telegram
  event: message.received
  filters:
    hook:
      equals: todo
- connector: telegram
  event: channel_post.received
  filters:
    hook:
      equals: todo
- connector: telegram
  event: callback_query.received
  filters:
    hook:
      equals: todo
