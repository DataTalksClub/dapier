# Migration draft; save through dapier workflows save. No cutover is authorized.
id: invoice-intake
enabled: false
description: 'Zapier 153562936: Archive the single email attachment with the UTC email
  date, then forward to DataOps.'
tags:
- zapier-migration
- zapier-153562936
actions:
- id: email-date
  type: date_time
  value: '{date}'
  timezone: UTC
  format: '%Y-%m-%d'
- id: archive-attachment
  type: dropbox_upload
  connection_id: dropbox
  folder: /_dtc_paperwork/invoices
  source: attachment
  attachment_selection: single
  filename: '{steps.email-date.output.formatted}-{subject}.pdf'
  overwrite: false
  autorename: false
- id: file-to-dataops
  type: dataops
  auth_secret_id: dapier/dataops
  url_env: DATAOPS_INTAKE_URL
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice
