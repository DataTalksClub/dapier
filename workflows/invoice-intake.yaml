id: invoice-intake
enabled: true
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice
actions:
- id: triage
  type: code
  code: |
    import hashlib
    import re

    attachments = input.get("attachments") or []

    def main_type(attachment):
        return str((attachment or {}).get("content_type") or "").split(";")[0].strip().lower()

    def is_pdf(attachment):
        content_type = main_type(attachment)
        name = str((attachment or {}).get("filename") or "").strip().lower()
        return content_type == "application/pdf" or (
            content_type in ("", "application/octet-stream") and name.endswith(".pdf"))

    pdfs = [a for a in attachments if is_pdf(a)]

    def checksum_of(attachment):
        value = re.sub(r"^sha256:", "", str((attachment or {}).get("checksum") or ""), flags=re.I)
        if not re.fullmatch(r"[a-f0-9]{64}", value, flags=re.I):
            raise ValueError("Document checksum is required for archive naming")
        return value.lower()

    # Non-PDF attachments (vendor HTML, images, calendar parts) are dropped
    # end to end. With several PDFs a lone receipt wins over its paired
    # invoice (Stripe sends both; the receipt is the keeper); when the
    # keeper is ambiguous every PDF merges into one document instead of
    # picking arbitrarily.
    mode = "body"
    keep = []
    if len(pdfs) == 1:
        mode = "single"
        keep = pdfs
    elif len(pdfs) > 1:
        receipts = [a for a in pdfs if "receipt" in str(a.get("filename") or "").lower()]
        if len(receipts) == 1:
            mode = "receipt"
            keep = receipts
        else:
            mode = "merge"
            keep = pdfs
    document_key = ""
    if keep:
        keys = [checksum_of(a) for a in keep]
        if mode == "merge":
            document_key = hashlib.sha256(":".join(sorted(keys)).encode()).hexdigest()[:12]
        else:
            document_key = keys[0][:12]
    output = {"has_attachment": bool(keep), "attachment_count": len(attachments),
              "document_count": len(pdfs), "mode": mode, "document_key": document_key,
              "document_plan": {"mode": mode, "attachments": keep}}
  tests:
  - name: body-only email renders to PDF
    input:
      attachments: []
    expected:
      has_attachment: false
      attachment_count: 0
      document_count: 0
      mode: body
      document_key: ''
      document_plan: {mode: body, attachments: []}
  - name: single PDF follows the archive path
    input:
      attachments:
      - filename: invoice.pdf
        content_type: application/pdf
        checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expected:
      has_attachment: true
      attachment_count: 1
      document_count: 1
      mode: single
      document_key: aaaaaaaaaaaa
      document_plan:
        mode: single
        attachments:
        - filename: invoice.pdf
          content_type: application/pdf
          checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - name: a receipt beats its paired invoice
    input:
      attachments:
      - filename: Invoice-4T7L8W.pdf
        content_type: application/pdf
        checksum: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - filename: Receipt-4T7L8W.pdf
        content_type: application/pdf
        checksum: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    expected:
      has_attachment: true
      attachment_count: 2
      document_count: 2
      mode: receipt
      document_key: cccccccccccc
      document_plan:
        mode: receipt
        attachments:
        - filename: Receipt-4T7L8W.pdf
          content_type: application/pdf
          checksum: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  - name: an ambiguous pair merges instead of picking
    input:
      attachments:
      - filename: a.pdf
        content_type: application/pdf
        checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - filename: b.pdf
        content_type: application/pdf
        checksum: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expected:
      has_attachment: true
      attachment_count: 2
      document_count: 2
      mode: merge
      document_key: 6173cf9d3267
      document_plan:
        mode: merge
        attachments:
        - filename: a.pdf
          content_type: application/pdf
          checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        - filename: b.pdf
          content_type: application/pdf
          checksum: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - name: two receipt-named PDFs stay ambiguous
    input:
      attachments:
      - filename: Receipt-1.pdf
        content_type: application/pdf
        checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - filename: Receipt-2.pdf
        content_type: application/pdf
        checksum: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expected:
      has_attachment: true
      attachment_count: 2
      document_count: 2
      mode: merge
      document_key: 6173cf9d3267
      document_plan:
        mode: merge
        attachments:
        - filename: Receipt-1.pdf
          content_type: application/pdf
          checksum: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        - filename: Receipt-2.pdf
          content_type: application/pdf
          checksum: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - name: stapled Terms-of-Service HTML and images are dropped
    input:
      attachments:
      - content_type: text/html; charset=utf-8
        filename: Terms_of_Service_de_de.html
      - content_type: image/png
        filename: scan.png
      - filename: invoice.pdf
        content_type: application/pdf
        checksum: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    expected:
      has_attachment: true
      attachment_count: 3
      document_count: 1
      mode: single
      document_key: cccccccccccc
      document_plan:
        mode: single
        attachments:
        - filename: invoice.pdf
          content_type: application/pdf
          checksum: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  - name: boilerplate-only email still renders the body
    input:
      attachments:
      - content_type: text/html; charset=utf-8
        filename: Terms_of_Service_de_de.html
      - content_type: text/html; charset=utf-8
        filename: Terms_of_Service_de_de.html
    expected:
      has_attachment: false
      attachment_count: 2
      document_count: 0
      mode: body
      document_key: ''
      document_plan: {mode: body, attachments: []}
  - name: an unnamed octet-stream PDF still counts
    input:
      attachments:
      - filename: invoice.pdf
        content_type: application/octet-stream
        checksum: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    expected:
      has_attachment: true
      attachment_count: 1
      document_count: 1
      mode: single
      document_key: dddddddddddd
      document_plan:
        mode: single
        attachments:
        - filename: invoice.pdf
          content_type: application/octet-stream
          checksum: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  - name: a document without a checksum fails
    input:
      attachments:
      - filename: invoice.pdf
        content_type: application/pdf
    expected_error: checksum is required
- id: route
  type: condition
  when:
    steps.triage.output.result.has_attachment:
      equals: true
  then:
  - id: email-date
    type: date_time
    value: '{date}'
    timezone: UTC
    format: '%Y-%m-%d'
  - id: clean-subject
    type: code
    code: |
      import re
      subject = str(input.get("subject") or "").strip()
      subject = re.sub(r"^(?:(?:fwd?|re)\s*:\s*)+", "", subject, flags=re.I).strip()
      subject = re.sub(r"\s*\[(?:account|invoice\s*id)\s*:[^\]]*\]", "", subject, flags=re.I).strip()
      subject = re.sub(r"\s+Invoice\s+Available\b.*$", "", subject, flags=re.I).strip()
      if re.search(r"\bAmazon\s+Web\s+Services\b", subject, flags=re.I):
          subject = "Amazon Web Services"
      output = {"subject": subject or "Invoice"}
    tests:
    - name: forward prefix and receipt suffix come off
      input:
        subject: 'Fwd: Your Google Play Order Receipt from Oct 2, 2026'
      expected:
        subject: Your Google Play Order Receipt from Oct 2, 2026
    - name: AWS subjects normalize
      input:
        subject: 'Fwd: Amazon Web Services Invoice Available [Account: 1234]'
      expected:
        subject: Amazon Web Services
    - name: an empty subject falls back to Invoice
      input:
        subject: ''
      expected:
        subject: Invoice
  - id: make-document
    type: merge_pdfs
    plan_step: triage
    output_key: invoice-document/{event_id}.pdf
    output_bucket_env: RENDER_ARTIFACTS_BUCKET
  - id: file-to-dataops
    type: dataops
    connection_id: dropbox
    auth_secret_id: dapier/dataops
    document_step: route.then.make-document
  - id: build-filename
    type: code
    code: |
      import re
      def _out(*path):
          node = steps
          for key in path:
              if not isinstance(node, dict):
                  return None
              node = node.get(key)
          return node
      def _slug(value, limit=70):
          text = re.sub(r"\s+", " ", str(value or "")).strip()
          text = text.replace("/", "_").replace("\\", "_")
          return text[:limit].strip() or None
      date = _out("route.then.email-date", "output", "formatted")
      subject = _out("route.then.clean-subject", "output", "result", "subject")
      doc_key = _out("triage", "output", "result", "document_key")
      intake = _out("route.then.file-to-dataops", "output") or {}
      invoices = intake.get("invoices") if isinstance(intake, dict) else None
      preview = invoices[0] if isinstance(invoices, list) and invoices \
          and isinstance(invoices[0], dict) else {}
      tx_date = str(preview.get("transactionDate") or preview.get("transaction_date") or "").strip()
      use_date = tx_date if re.fullmatch(r"\d{4}-\d{2}-\d{2}", tx_date) \
          else (str(date or "").strip() or "undated")
      vendor = _slug(preview.get("counterparty")) or _slug(subject) or "Invoice"
      inv_no = _slug(preview.get("invoiceNumber") or preview.get("invoice_number"), 40)
      key = re.sub(r"[^a-f0-9]", "", str(doc_key or "").lower())[:12]
      parts = [use_date, vendor]
      if inv_no:
          parts.append(inv_no)
      if key:
          parts.append(key)
      output = {"filename": "-".join(parts) + ".pdf"}
    tests:
    - name: no DataOps preview falls back to subject and checksum
      steps:
        route.then.email-date:
          output:
            formatted: 2026-10-04
        route.then.clean-subject:
          output:
            result:
              subject: Acme
        triage:
          output:
            result:
              document_key: abcdef123456
        route.then.file-to-dataops:
          output:
            status: accepted
      expected:
        filename: 2026-10-04-Acme-abcdef123456.pdf
    - name: a DataOps preview names vendor, invoice date and number
      steps:
        route.then.email-date:
          output:
            formatted: 2026-10-04
        route.then.clean-subject:
          output:
            result:
              subject: Acme
        triage:
          output:
            result:
              document_key: abcdef123456
        route.then.file-to-dataops:
          output:
            status: accepted
            invoices:
            - counterparty: Acme Ltd
              transactionDate: 2026-09-30
              invoiceNumber: INV-1
      expected:
        filename: 2026-09-30-Acme Ltd-INV-1-abcdef123456.pdf
    - name: an invalid preview date falls back to the email date
      steps:
        route.then.email-date:
          output:
            formatted: 2026-10-04
        route.then.clean-subject:
          output:
            result:
              subject: Acme
        triage:
          output:
            result:
              document_key: abcdef123456
        route.then.file-to-dataops:
          output:
            already_exists: true
            invoices:
            - counterparty: Acme Ltd
              transactionDate: not-a-date
      expected:
        filename: 2026-10-04-Acme Ltd-abcdef123456.pdf
  - id: archive-document
    type: dropbox_upload
    connection_id: dropbox
    source: step
    step: route.then.make-document
    folder: /_dtc_paperwork/invoices
    filename: '{steps.route.then.build-filename.output.result.filename}'
    overwrite: false
    autorename: false
    strict_conflict: true
    skip_existing: true
  else:
  - id: strip-forwarded
    type: code
    code: |
      import re

      body = input.get("body") if isinstance(input.get("body"), dict) else {}
      piece = body.get("html")
      if not isinstance(piece, dict):
          piece = {"value": input.get("html") if isinstance(input.get("html"), str) else ""}
      html = str(piece.get("value") or "")
      if not html:
          part = body.get("text") if isinstance(body.get("text"), dict) else {}
          text = str(part.get("value") or "")
          for old, new in (("&", "&amp;"), ("<", "&lt;"), (">", "&gt;")):
              text = text.replace(old, new)
          html = f"<pre>{text}</pre>"
      marker = re.search(r"-{2,}\s*Forwarded message\s*-{2,}", html, flags=re.I)
      stripped = html
      if marker:
          # Walk the header lines that follow the marker (From/Date/Subject/
          # To/..., through tags and whitespace), then cut marker plus
          # headers in one go. Anchored matches keep this linear.
          separator = r"(?:\s|<[^>]*>)*"
          # A header line runs to the end of the line or the next block tag,
          # whichever comes first — addresses like <a@b.c> ride along (they
          # only look like tags).
          line_body = r"(?:[^\n<]|<(?!/?(?:div|p|br)\b)[^>]*>)*"
          header_line = re.compile(
              separator + r"(?:from|date|subject|to|cc|bcc|reply-to)\s*:" + line_body,
              flags=re.I,
          )
          position = marker.end()
          matched = header_line.match(html, position)
          while matched:
              position = matched.end()
              matched = header_line.match(html, position)
          # Drop the marker's own now-empty wrapper tags: bare closing tags
          # ahead of the cut, then the header block's closers behind it.
          prefix = re.sub(r"(?:<[^>]*>|\s)*$", "", html[:marker.start()])
          boundary = re.match(r"(?:</(?:div|p)>|\s)*", html[position:])
          stripped = prefix + html[position + boundary.end():]
      output = {"html": stripped.strip(), "forwarded_header_removed": marker is not None}
    tests:
    - name: the forwarded header block goes, the receipt stays
      input:
        body:
          html:
            value: "<div>---------- Forwarded message ----------</div><div>From: Google
              Play <googleplay-noreply@google.com></div><div>Date: Fri, Oct 2, 2026,
              08:56</div><div>Subject: Your Google Play Order Receipt from Oct 2,
              2026</div><div>To: <alexey.s.grigoriev@gmail.com></div><div><table><tr><td>Order
              total: 0.99 EUR</td></tr></table></div>"
      expected:
        html: "<div><table><tr><td>Order total: 0.99 EUR</td></tr></table></div>"
        forwarded_header_removed: true
    - name: a plaintext forward keeps only the body
      input:
        body:
          html:
            value: "---------- Forwarded message ----------\nFrom: a@b.c\nDate:
              today\nSubject: Receipt\nTo: d@e.f\n\nOrder total: 42 EUR\n"
      expected:
        html: "Order total: 42 EUR"
        forwarded_header_removed: true
    - name: no marker leaves the body alone
      input:
        body:
          html:
            value: <p>Receipt</p>
      expected:
        html: <p>Receipt</p>
        forwarded_header_removed: false
    - name: a text-only email renders from a pre block
      input:
        body:
          text:
            value: "Total: 1.00 EUR\n"
          html: null
      expected:
        html: "<pre>Total: 1.00 EUR\n</pre>"
        forwarded_header_removed: false
  - id: render-pdf
    type: render_html_to_pdf
    input_field: html
    input_value: '{steps.route.else.strip-forwarded.output.result.html}'
    output_key: invoice-body/{event_id}.pdf
    output_bucket_env: RENDER_ARTIFACTS_BUCKET
    pdf:
      page_format: A4
      print_background: true
