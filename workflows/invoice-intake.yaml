# Invoice intake: vendor invoice emails to `invoice@mailer.dtcdev.click`
# are filed straight into the DataOps document intake.
#
# Dapier is only the pipe here — trigger plus one action. Parsing and
# confirmation live on the DataOps side (the intake endpoint verifies
# checksums and files each attachment as a DataOps artifact).
#
# Live setup (workflows are operator config; this file is the canonical
# definition):
#   dapier workflows save workflows/invoice-intake.yaml
#   dapier workflows publish invoice-intake
#   dapier workflows on invoice-intake
# Requires the `dapier/dataops` secret (the DataOps intake token) and
# DATAOPS_INTAKE_URL / DATAOPS_EMAIL_DOCUMENTS_BUCKET on the Worker.
id: invoice-intake
enabled: true
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice
actions:
  # Stage the original PDF into the DataOps documents bucket and post it
  # to the intake endpoint; DataOps owns extraction and review from there.
  - id: file-to-dataops
    type: dataops
    auth_secret_id: dapier/dataops
    url_env: DATAOPS_INTAKE_URL
