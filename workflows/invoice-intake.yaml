# Migration draft; save through dapier workflows save. No cutover is authorized.
id: invoice-intake
enabled: false
description: 'Zapier 153562936: Archive the single email attachment with the UTC email
  date, then forward to DataOps.'
actions:
- id: email-date
  type: date_time
  value: '{date}'
  timezone: UTC
  format: '%Y-%m-%d'
- id: clean-subject
  type: code
  code: |
    import re
    subject = str(input.get("subject") or "").strip()
    subject = re.sub(r"^(?:(?:fwd?|re)\s*:\s*)+", "", subject, flags=re.I).strip()
    subject = re.sub(r"\s*\[(?:account|invoice\s*id)\s*:[^\]]*\]", "", subject, flags=re.I).strip()
    subject = re.sub(r"\s+Invoice\s+Available\b.*$", "", subject, flags=re.I).strip()
    if re.search(r"\bAmazon\s+Web\s+Services\b", subject, flags=re.I):
        subject = "Amazon Web Services"
    attachment = (input.get("attachments") or [{}])[0]
    checksum = re.sub(r"^sha256:", "", str(attachment.get("checksum") or ""), flags=re.I)
    if not re.fullmatch(r"[a-f0-9]{64}", checksum, flags=re.I):
        raise ValueError("Attachment checksum is required for archive naming")
    output = {"subject": subject or "Invoice", "document_key": checksum.lower()[:12]}
- id: archive-attachment
  type: dropbox_upload
  connection_id: dropbox
  folder: /_dtc_paperwork/invoices
  source: attachment
  attachment_selection: single
  filename: '{steps.email-date.output.formatted}-{steps.clean-subject.output.result.subject}-{steps.clean-subject.output.result.document_key}.pdf'
  overwrite: false
  autorename: false
  strict_conflict: true
- id: file-to-dataops
  type: dataops
  auth_secret_id: dapier/dataops
  url_env: DATAOPS_INTAKE_URL
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice
