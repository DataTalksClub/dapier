# Paired with invoice-intake's body branch: the renderer reports
# job.completed with the source event's route, so a rendered invoice body
# completes through this flow. DataOps goes first; its invoice preview
# names the Dropbox file via build-filename. Missing company metadata
# stops the run rather than archiving under the email subject.
id: invoice-body-completion
enabled: true
trigger:
  connector: renderer
  event: job.completed
  filters:
    route:
      equals: invoice
actions:
- id: email-date
  type: date_time
  value: '{source_event.data.date}'
  timezone: UTC
  format: '%Y-%m-%d'
- id: clean-subject
  type: code
  code: |
    import re
    source = input.get("source_event") or {}
    payload = source.get("data") if isinstance(source, dict) else {}
    if not isinstance(payload, dict):
        payload = {}
    subject = str(payload.get("subject") or "").strip()
    subject = re.sub(r"^(?:(?:fwd?|re)\s*:\s*)+", "", subject, flags=re.I).strip()
    subject = re.sub(r"\s*\[(?:account|invoice\s*id)\s*:[^\]]*\]", "", subject, flags=re.I).strip()
    subject = re.sub(r"\s+Invoice\s+Available\b.*$", "", subject, flags=re.I).strip()
    if re.search(r"\bAmazon\s+Web\s+Services\b", subject, flags=re.I):
        subject = "Amazon Web Services"
    checksum = re.sub(r"^sha256:", "", str(input.get("checksum") or ""), flags=re.I)
    if not re.fullmatch(r"[a-f0-9]{64}", checksum, flags=re.I):
        raise ValueError("Rendered PDF checksum is required for archive naming")
    output = {"subject": subject or "Invoice", "document_key": checksum.lower()[:12]}
  tests:
  - name: forward prefix comes off
    input:
      checksum: 839f39e8a3ba40d9ab870cc949a2340c93c22a2b6a5f652c9e9828196a1d1ed0
      source_event:
        data:
          subject: 'Fwd: Your Google Play Order Receipt from Oct 2, 2026'
    expected:
      subject: Your Google Play Order Receipt from Oct 2, 2026
      document_key: 839f39e8a3ba
  - name: AWS subjects normalize
    input:
      checksum: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      source_event:
        data:
          subject: 'Fwd: Amazon Web Services Invoice Available [Account: 1234]'
    expected:
      subject: Amazon Web Services
      document_key: bbbbbbbbbbbb
  - name: a missing checksum fails
    input:
      source_event:
        data:
          subject: Invoice
    expected_error: checksum is required
- id: intake-rendered
  type: dataops
  connection_id: dataops
  auth_secret_id: dapier/dataops
- id: build-filename
  type: code
  code: |
    import re
    def _out(*path):
        node = steps
        for key in path:
            if not isinstance(node, dict):
                return None
            node = node.get(key)
        return node
    def _slug(value, limit=70):
        text = re.sub(r"\s+", " ", str(value or "")).strip()
        text = text.replace("/", "_").replace("\\", "_")
        return text[:limit].strip() or None
    date = _out("email-date", "output", "formatted")
    subject = _out("clean-subject", "output", "result", "subject")
    doc_key = _out("clean-subject", "output", "result", "document_key")
    intake = _out("intake-rendered", "output") or {}
    invoices = intake.get("invoices") if isinstance(intake, dict) else None
    preview = invoices[0] if isinstance(invoices, list) and invoices \
        and isinstance(invoices[0], dict) else {}
    tx_date = str(preview.get("transactionDate") or preview.get("transaction_date") or "").strip()
    use_date = tx_date if re.fullmatch(r"\d{4}-\d{2}-\d{2}", tx_date) \
        else (str(date or "").strip() or "undated")
    vendor = _slug(preview.get("counterparty"))
    if not vendor:
        raise ValueError("DataOps has no extracted company; refusing an email-subject archive name")
    inv_no = _slug(preview.get("invoiceNumber") or preview.get("invoice_number"), 40)
    key = re.sub(r"[^a-f0-9]", "", str(doc_key or "").lower())[:12]
    parts = [use_date, vendor]
    if inv_no:
        parts.append(inv_no)
    if key:
        parts.append(key)
    output = {"filename": "-".join(parts) + ".pdf"}
  tests:
  - name: a missing company stops archival
    steps:
      email-date:
        output:
          formatted: '2026-10-04'
      clean-subject:
        output:
          result:
            subject: Your Google Play Order Receipt from Oct 2, 2026
            document_key: 839f39e8a3ba
      intake-rendered:
        output:
          status: accepted
    expected_error: no extracted company
  - name: a DataOps preview names vendor, invoice date and number
    steps:
      email-date:
        output:
          formatted: '2026-10-04'
      clean-subject:
        output:
          result:
            subject: Receipt
            document_key: 839f39e8a3ba
      intake-rendered:
        output:
          status: accepted
          invoices:
          - counterparty: Google Play
            transactionDate: '2026-10-02'
            invoiceNumber: GPA-123
    expected:
      filename: 2026-10-02-Google Play-GPA-123-839f39e8a3ba.pdf
- id: archive-rendered
  type: dropbox_upload
  connection_id: dropbox
  source: output
  folder: /_dtc_paperwork/invoices
  filename: '{steps.build-filename.output.result.filename}'
  overwrite: false
  autorename: false
  strict_conflict: true
  skip_existing: true
