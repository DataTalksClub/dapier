# Action chain of the live telegram-crosspost workflow (Telegram -> Slack).
- id: mlops
  type: condition
  when:
    chat_id:
      equals: '-1001730331343'
  then:
  - id: post-mlops
    type: slack
    connection_id: slack
    channel: course-mlops-zoomcamp
    telegram_format: true
    source_link: https://t.me/dtc_courses/{message_id}
