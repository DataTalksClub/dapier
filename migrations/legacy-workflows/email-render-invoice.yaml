id: email-render-invoice
enabled: true
actions:
  - id: render-pdf
    type: render_html_to_pdf
    input_field: html
    output_bucket_env: RENDER_ARTIFACTS_BUCKET
    output_key: rendered/{event_id}.pdf
    pdf:
      page_format: A4
      print_background: true
trigger:
  connector: email
  event: message.received
  filters:
    route:
      equals: invoice-pdf
