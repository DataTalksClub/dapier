# Starter template: Slack message -> email notification.
#
# Templates are ordinary workflows flagged `template: true` and shipped
# disabled: applying one (`dapier templates apply` or the designer gallery)
# forks it under a new id with the flag stripped, so only your copy runs.
# The Slack side needs the Events API subscription (message.received); set
# `to` to your address, then enable the fork.
id: template-slack-to-email
enabled: false
template: true
description: Email yourself every Slack channel message
tags: [starter]
actions:
  - id: notify
    type: email_send
    to: you@example.com
    subject: "Slack: {channel}"
    text: "{text}\n\n— {user} in #{channel}"
trigger:
  connector: slack
  event: message.received
  filters: {}
