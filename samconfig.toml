version = 0.1

[sandbox.global.parameters]
stack_name = "dapier"
region = "eu-west-1"

[sandbox.build.parameters]
cached = true

[sandbox.deploy.parameters]
resolve_s3 = true
resolve_image_repos = true
capabilities = "CAPABILITY_IAM"
role_arn = "arn:aws:iam::817685572750:role/dapier-cloudformation-service"
confirm_changeset = false
fail_on_empty_changeset = false
# Parameter overrides, including the Cognito AuthClientId, are supplied by
# scripts/deploy.sh, which resolves the auth ones from the shared-auth
# stack instead of hardcoding them here.
