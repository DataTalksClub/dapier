[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dapier"
version = "0.1.0"
description = "Operator CLI for the Dapier OAuth token factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyjwt[crypto]>=2.10"]

[project.scripts]
dapier = "dapier_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dapier_cli*"]
