# CRM Company Signal Ingest Configuration
#
# Sources:
# - A: newsletter@ digest sponsors (reused from newsletter-sponsors flow)
# - B: Curated RSS feeds below (funding, announcements)
# - C: Human forwards to orin@ (orin-mailbox flow)
#
# Process:
# Deduplicate on source-key: signal:{kind}:{domain}:{url-or-msgid-hash}
# Filter through ICP allow/deny lists (DTC: data/ML/AI engineering education buyers)
# Clear company -> match or create org in DataOps CRM + write P1 signal note
# Unclear company -> hold file with ~14d TTL + Hub intake task for project orin
#
# Cadence: 2x/day Europe/Berlin (08:00 and 16:00 Berlin)

version: "2026-10-19"

# Curated RSS Feeds (Source B)
feeds:
  - name: techcrunch-startups
    url: https://techcrunch.com/category/startups/feed/
    default_kind: funding
    enabled: true
    description: "TechCrunch startups and venture funding feed"
  - name: eu-startups-funding
    url: https://www.eu-startups.com/feed/
    default_kind: funding
    enabled: true
    description: "EU-Startups European startup funding and news feed"
  # Note: Rely on Source A (newsletter@) for digest sponsors (e.g. AlphaSignal,
  # The Batch, TLDR AI). Do not duplicate AlphaSignal via RSS.

# Ideal Customer Profile (ICP) for DataTalksClub
# Target: Organizations with engineering teams in data, ML, AI, MLOps, analytics
# who hire, upskill, or sponsor tech education communities and courses.
icp:
  # Positive signals: relevant domains, technologies, markets
  allow_keywords:
    - data
    - "machine learning"
    - ml
    - "artificial intelligence"
    - ai
    - mlops
    - analytics
    - "data engineering"
    - python
    - llm
    - llms
    - "deep learning"
    - database
    - devops
    - cloud
    - infrastructure
    - "developer tools"
    - etl
    - bi
    - "data platform"
    - "vector search"
    - generative ai
    - computer vision
    - nlp
    - data observability
    - data science

  # Exclude non-ICP markets and high-noise sectors
  deny_keywords:
    - gambling
    - casino
    - betting
    - fashion
    - apparel
    - "real estate brokerage"
    - therapeutics
    - "drug discovery"
    - tobacco
    - cannabis
    - adult
    - dating
    - jewelry

  # Allowed stages/rounds (empty means all stages permitted)
  allowed_stages:
    - pre-seed
    - seed
    - series-a
    - series-b
    - series-c
    - series-d
    - growth
    - debt
    - grant

# Settings
settings:
  unmatched_hold_ttl_days: 14
  hold_file_path: "~/.dapier/crm-signals/unmatched-hold.json"
  seen_store_path: "~/.dapier/crm-signals/seen-keys.json"
  source_key_template: "signal:{kind}:{domain}:{hash}"
  auto_signal_kinds:
    - funding
    - sponsored_elsewhere
  timezone: "Europe/Berlin"
  schedule_cron: "0 8,16 * * * Europe/Berlin"
