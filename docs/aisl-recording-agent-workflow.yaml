# AI Shipping Labs recording intake: a Zoom cloud recording.completed
# webhook starts one headless agent that drives the platform's own API to
# store the recording, ingest the transcript, and draft the recap.
# Reference copy of the live workflow (save/publish via `dapier workflows`).
id: aisl-recording-agent
description: >
  AI Shipping Labs: a new Zoom cloud recording starts an agent that uploads
  it through the platform, ingests the transcript, drafts the recap, and
  verifies the event page links.
enabled: true
notify: [alexey@datatalks.club]
actions:
  - id: process-recording
    type: agent
    engine: claude
    notify_to: alexey@datatalks.club
    notify_from: agents@dtcdev.click
    prompt: |
      You are the AI Shipping Labs recording processor. A Zoom cloud
      recording just completed. Work autonomously and finish with a report;
      do not ask questions.

      Recording event from Zoom:
      - meeting_id: {meeting_id}
      - topic: {topic}
      - host_email: {host_email}
      - start_time: {start_time}
      - share_url: {share_url}

      Setup: run shell commands from /home/alexey/git/ai-shipping-labs. Read
      that repo's AGENTS.md and the skills ai-shipping-labs-prod-api,
      ai-shipping-labs-events, ai-shipping-labs-event-recaps, plus
      _docs/integrations/s3_recordings.md. Authenticate to the production
      API exactly as the prod-api skill describes.

      1. Match the event: find exactly one AI Shipping Labs event whose
      zoom_meeting_id equals {meeting_id} using the production API. Never
      create an event. If no event matches, or several match, stop and
      report the ambiguity (include topic and start time) without changing
      anything.

      2. Recording pipeline: read the event's recording fields first. If
      recording_s3_url is already set, skip to step 4. Otherwise POST
      /api/events/<slug>/sync-transcript - the platform re-lists the Zoom
      recording, stores the MP4 download and transcript URLs, and enqueues
      the S3 upload itself. Only if no upload starts, POST
      /api/events/<slug>/retry-recording-upload. Poll the event until
      recording_upload_status is uploaded, or report the failure with the
      API error. Never download or upload the video yourself; never touch
      AWS credentials for the video.

      3. Transcript: ensure the transcript is stored. sync-transcript queues
      transcript ingest when the parsed text is missing; poll until
      transcript_text is present, or report that Zoom produced no
      transcript.

      4. Recap: follow the ai-shipping-labs-event-recaps skill to produce
      the recap from the stored transcript, and save it through the event's
      source of truth (API-backed update for a Studio event, or the content
      repo's recap_file for a GitHub-origin event). Verify the canonical
      recap URL loads. If the skill's source-fetch step assumes YouTube, use
      the event's stored transcript or the fetch-zoom skill with the Zoom
      share URL instead.

      5. Link check: verify the event page shows the recording
      (recording_s3_url set; the streaming card renders for entitled
      viewers). If the event already has an external recording_url, leave
      it untouched.

      6. Do not notify registrants, do not post to Slack, do not delete or
      cancel anything. Keep passcodes, raw transcripts, chat logs, and
      presigned URLs private.

      7. Report, in this order: event slug and title, recording upload
      status, transcript status, recap URL, event page URL, and any
      blocker.
trigger:
  connector: zoom
  event: recording.completed
