name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dapier-sandbox
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  windows-private-files:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Windows credential file ACLs and CLI output
        run: uv run --with pytest pytest --noconftest -q tests/test_private_files.py tests/test_cli_encoding.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout shared device login
        run: git clone --depth 1 https://github.com/DataTalksClub/auth.git /tmp/dtc-auth
      - name: Point the CLI at the shared device login
        run: echo DTC_AUTH_HOME=/tmp/dtc-auth >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
      # Avoid the slow Azure archive without changing APT trust policy.
      - name: Configure bounded Ubuntu dependency downloads
        run: sudo python scripts/configure-ci-apt.py
      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: uv run --with playwright python -m playwright install-deps chromium
      - name: Install Chromium for the console boot test
        timeout-minutes: 10
        run: uv run --with playwright python -m playwright install chromium
      - run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: designer/package-lock.json
      - run: npm ci --prefix designer
      - run: npm --prefix designer run typecheck
      - run: npm --prefix designer run test:email
      - run: npm --prefix designer run test:board
      - run: npm --prefix designer run build:console
      - run: git diff --exit-code -- src/web/designer.js src/web/designer.css
      - run: make layer
      - run: sam validate --lint
      - run: sam build --config-env sandbox

  # Per-plugin lanes: fast feedback on a plugin's own tests. The deploy
  # gate stays the full `make test` above, which includes every lane.
  plugin-lanes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [slack, telegram, dropbox, aws, zoom, google, dataops, cmp, llm, typefully, hub]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: make plugin-test PLUGIN=${{ matrix.plugin }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::817685572750:role/dapier-github-actions-deploy
          role-session-name: dapier-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy renderer ECR access policy stack
        run: |
          aws cloudformation deploy \
            --template-file infra/renderer-ecr-access.yaml \
            --stack-name dapier-renderer-ecr-access \
            --capabilities CAPABILITY_IAM \
            --role-arn arn:aws:iam::817685572750:role/dapier-cloudformation-service \
            --region "$AWS_REGION"
      - name: Deploy backup inspection access policy stack
        run: |
          aws cloudformation deploy \
            --template-file infra/backup-inspection-access.yaml \
            --stack-name dapier-backup-inspection-access \
            --capabilities CAPABILITY_IAM \
            --role-arn arn:aws:iam::817685572750:role/dapier-cloudformation-service \
            --region "$AWS_REGION"
      - name: Capture renderer ECR recovery evidence (read-only)
        run: |
          echo "Current dapier stack status:"
          aws cloudformation describe-stacks --stack-name dapier \
            --query 'Stacks[0].StackStatus' --output text
          echo "Configured renderer image URI parameter:"
          aws cloudformation describe-stacks --stack-name dapier \
            --query "Stacks[0].Parameters[?ParameterKey=='HtmlRendererImageUri'].ParameterValue | [0]" \
            --output text
          echo "HtmlRendererFunction UPDATE_FAILED stack events:"
          aws cloudformation describe-stack-events --stack-name dapier \
            --query "StackEvents[?LogicalResourceId=='HtmlRendererFunction' && ResourceStatus=='UPDATE_FAILED'].[Timestamp,ResourceStatusReason]" \
            --output json
          echo "Current HtmlRendererFunction ECR image URI:"
          aws lambda get-function \
            --function-name arn:aws:lambda:eu-west-1:817685572750:function:dapier-HtmlRendererFunction-s5wWD6uc7J6v \
            --query 'Code.ImageUri' --output text
          echo "Live dapier-html-renderer repository policy before repair:"
          aws ecr get-repository-policy --registry-id 817685572750 \
            --repository-name dapier-html-renderer --query policyText --output text
      - run: make layer
      - run: sam build --config-env sandbox
      - name: Apply renderer ECR policy before rollback recovery
        run: uv run --with pyyaml python scripts/apply-renderer-ecr-policy.py
      - name: Inspect effective renderer ECR policy (read-only)
        continue-on-error: true
        run: |
          aws ecr get-repository-policy --registry-id 817685572750 \
            --repository-name dapier-html-renderer \
            --query policyText --output text || echo "Unable to read renderer ECR policy with deploy role"
      - name: Check renderer image artifact (read-only)
        continue-on-error: true
        run: |
          aws ecr batch-get-image --registry-id 817685572750 \
            --repository-name dapier-html-renderer \
            --image-ids imageTag=20260712-lambda \
            --query '{images:images[].imageId,failures:failures}' --output json
      # A failed deploy whose rollback also failed leaves the stack in
      # UPDATE_ROLLBACK_FAILED, where every further deploy is rejected.
      - name: Resume an interrupted rollback
        run: |
          status=$(aws cloudformation describe-stacks --stack-name dapier \
            --query 'Stacks[0].StackStatus' --output text)
          echo "stack status: $status"
          if [ "$status" = "UPDATE_ROLLBACK_FAILED" ]; then
            # Resume the complete rollback. The repository policy in the
            # template grants the deploy role access to the renderer image,
            # allowing CloudFormation to restore the function without skips.
            aws cloudformation continue-update-rollback --stack-name dapier
            for attempt in {1..60}; do
              status=$(aws cloudformation describe-stacks --stack-name dapier \
                --query 'Stacks[0].StackStatus' --output text)
              echo "rollback status: $status"
              if [ "$status" = "UPDATE_ROLLBACK_COMPLETE" ]; then
                break
              fi
              case "$status" in
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|ROLLBACK_COMPLETE)
                  echo "rollback stopped in unexpected state: $status"
                  echo "Recent CloudFormation stack events (newest first):"
                  aws cloudformation describe-stack-events --stack-name dapier \
                    --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
                    --output table
                  exit 1
                  ;;
              esac
              sleep 10
            done
            if [ "$status" != "UPDATE_ROLLBACK_COMPLETE" ]; then
              echo "timed out waiting for rollback recovery"
              exit 1
            fi
          fi
      - run: scripts/deploy.sh
      - name: Verify deployed stack status
        run: |
          status=$(aws cloudformation describe-stacks --stack-name dapier \
            --query 'Stacks[0].StackStatus' --output text)
          echo "StackStatus: $status"
          case "$status" in
            UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
            *) echo "Unexpected dapier stack status: $status"; exit 1 ;;
          esac
      - run: curl --fail --silent --show-error https://dapier.dtcdev.click/health
      - name: Inspect DynamoDB backup health (read-only)
        # Missing inspection permissions must be reported as unverified,
        # without hiding the result of the infrastructure deployment. The
        # grants behind this step live in infra/backup-inspection-access.yaml
        # and are checked against the calls made here by
        # tests/test_backup.py::test_backup_inspection_grants_match_deploy_step.
        continue-on-error: true
        run: |
          uv run --with boto3 python - <<'PY'
          import json
          import time
          from contextlib import contextmanager
          from datetime import datetime, timedelta, timezone
          import boto3
          from botocore.exceptions import ClientError

          @contextmanager
          def inspect(label):
              try:
                  yield
              except ClientError as exc:
                  print('BACKUP_UNVERIFIED', label, exc.response['Error']['Code'])

          cf = boto3.client('cloudformation')
          def physical(logical):
              return cf.describe_stack_resource(StackName='dapier', LogicalResourceId=logical)['StackResourceDetail']['PhysicalResourceId']
          fn = physical('BackupFunction')
          bucket = physical('BackupBucket')
          alarm = physical('BackupErrorAlarm')
          config = {}
          with inspect('config'):
              config = boto3.client('lambda').get_function_configuration(FunctionName=fn)
              print('BACKUP_CONFIG', json.dumps({k: config[k] for k in ('FunctionName', 'MemorySize', 'LastModified', 'CodeSha256')}))
              assert config['MemorySize'] >= 512
          cw = boto3.client('cloudwatch')
          with inspect('alarm'):
              states = cw.describe_alarms(AlarmNames=[alarm])['MetricAlarms']
              print('BACKUP_ALARM', json.dumps([{k: a[k] for k in ('AlarmName', 'StateValue', 'StateUpdatedTimestamp')} for a in states], default=str))
          with inspect('error-metrics'):
              # Every hour of the last four days in which the backup function
              # errored at all — absence after a scheduled run is the proof
              # that the run was green, not just that the alarm went quiet.
              points = sorted(
                  (str(point['Timestamp']), point['Sum'])
                  for point in cw.get_metric_statistics(
                      Namespace='AWS/Lambda', MetricName='Errors',
                      Dimensions=[{'Name': 'FunctionName', 'Value': fn}],
                      StartTime=datetime.now(timezone.utc) - timedelta(days=4),
                      EndTime=datetime.now(timezone.utc), Period=3600,
                      Statistics=['Sum'])['Datapoints'])
              print('BACKUP_ERROR_METRICS', json.dumps({'hours_with_errors': points}))
          logs = boto3.client('logs')
          # Only runtime reports and aggregate backup counts, never table items.
          for pattern in ('"REPORT"', '"backup" "items" "across"'):
              with inspect('logs'):
                  result = logs.filter_log_events(logGroupName='/aws/lambda/' + fn, startTime=int((time.time() - 3 * 86400) * 1000), filterPattern=pattern, limit=50)
                  print('BACKUP_LOGS', json.dumps({'events': [{'timestamp': e['timestamp'], 'message': e['message']} for e in result.get('events', [])], 'morePages': bool(result.get('nextToken'))}))
          dynamo = boto3.client('dynamodb')
          names = sorted({v for k, v in config.get('Environment', {}).get('Variables', {}).items() if k.endswith('_TABLE') and k != 'TEAM_SECRETS_TABLE' and v})
          for name in names:
              with inspect('table-size ' + name):
                  table = dynamo.describe_table(TableName=name)['Table']
                  print('BACKUP_TABLE_SIZE', json.dumps({k: table[k] for k in ('TableName', 'ItemCount', 'TableSizeBytes')}))
          s3 = boto3.client('s3')
          now = datetime.now(timezone.utc)
          days = [(now - timedelta(days=offset)).strftime('%Y-%m-%d') for offset in range(5)]
          with inspect('recent-backups'):
              listed = s3.list_objects_v2(Bucket=bucket, Prefix='backups/').get('Contents', [])
              manifests = sorted(str(o['LastModified']) + ' ' + o['Key'] for o in listed
                                 if o['Key'].endswith('/manifest.json'))
              print('BACKUP_RECENT_MANIFESTS', json.dumps({'recent': manifests[-7:], 'objects': len(listed)}))
          # Verify the newest day that has a snapshot: a deploy earlier in the
          # day runs before that day's 03:00Z backup, so "no manifest yet" for
          # today is normal and yesterday's snapshot is the verified one.
          verified = None
          with inspect('snapshot'):
              for day in days:
                  key = f'backups/{day}/manifest.json'
                  try:
                      obj = s3.get_object(Bucket=bucket, Key=key)
                  except ClientError as exc:
                      if exc.response.get('Error', {}).get('Code') == 'NoSuchKey':
                          if day == days[0]:
                              print('BACKUP_NO_SNAPSHOT_YET', day)
                          continue
                      raise
                  manifest = json.loads(obj['Body'].read())
                  print('BACKUP_MANIFEST', json.dumps({'path': f's3://{bucket}/{key}', 'lastModified': str(obj['LastModified']), 'date': manifest['date'], 'tables': manifest['tables']}))
                  assert manifest['date'] == day
                  if config:
                      assert set(manifest['tables']) == set(names)
                  for name, stats in manifest['tables'].items():
                      assert 'error' not in stats, name
                      head = s3.head_object(Bucket=bucket, Key=stats['key'])
                      assert head['ContentLength'] == stats['bytes'], name
                  print('BACKUP_SNAPSHOT_OBJECTS_VERIFIED', day, len(manifest['tables']))
                  verified = day
                  break
          if verified:
              print('BACKUP_SNAPSHOT_DAY_VERIFIED', verified)
              print('Scheduled success requires a manifest and successful runtime report for the latest backup day; alarm OK alone is insufficient.')
          PY
      - name: Inspect YouTube renewal infrastructure (read-only)
        run: bash scripts/inspect-youtube-renewal.sh
