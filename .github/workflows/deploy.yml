name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dapier-sandbox
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: aws-actions/setup-sam@v2
      - run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: designer/package-lock.json
      - run: npm ci --prefix designer
      - run: npm --prefix designer run typecheck
      - run: npm --prefix designer run test:email
      - run: npm --prefix designer run build:console
      - run: git diff --exit-code -- src/web/designer.js src/web/designer.css
      - run: make layer
      - run: sam validate --lint
      - run: sam build --config-env sandbox

  # Per-plugin lanes: fast feedback on a plugin's own tests. The deploy
  # gate stays the full `make test` above, which includes every lane.
  plugin-lanes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [slack, rss, mailchimp, telegram, dropbox, aws, zoom]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: make plugin-test PLUGIN=${{ matrix.plugin }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::817685572750:role/dapier-github-actions-deploy
          role-session-name: dapier-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: make layer
      - run: sam build --config-env sandbox
      # A failed deploy whose rollback also failed leaves the stack in
      # UPDATE_ROLLBACK_FAILED, where every further deploy is rejected.
      - name: Resume an interrupted rollback
        run: |
          status=$(aws cloudformation describe-stacks --stack-name dapier \
            --query 'Stacks[0].StackStatus' --output text)
          echo "stack status: $status"
          if [ "$status" = "UPDATE_ROLLBACK_FAILED" ]; then
            aws cloudformation continue-update-rollback --stack-name dapier
            aws cloudformation wait stack-update-complete --stack-name dapier
          fi
      - run: scripts/deploy.sh
      - run: curl --fail --silent --show-error https://dapier.dtcdev.click/health
      - name: Inspect YouTube renewal infrastructure (read-only)
        run: bash scripts/inspect-youtube-renewal.sh
