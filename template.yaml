AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Code-configured serverless automation runner

Parameters:
  DomainName:
    Type: String
    Default: dapier.dtcdev.click
  DomainCertificateArn:
    Type: String
  HostedZoneId:
    Type: String
    Default: Z05963572WVWFHDQZH5NE
  HtmlRendererImageUri:
    Type: String
  DatamailerInboundBucketName:
    Type: String
    Default: dapier-mail-817685572750
  InboundEmailTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:817685572750:datamailer-sandbox-inbound-email-events
  DataOpsIntakeUrl:
    Type: String
    Default: https://el4jt4z2k4lnxwvoqawrdcsedm0axjzc.lambda-url.eu-west-1.on.aws/api/v1/intake/email-documents
  AuthBaseUrl:
    Type: String
    Default: https://auth.dtcdev.click
  AuthClientId:
    Type: String
  AuthCliClientId:
    Type: String
    Default: ''
    Description: DTC shared-auth public client ID for the dapier CLI (empty disables CLI token issuance)
  AuthIssuer:
    Type: String
  AuthJwksUrl:
    Type: String
  OperatorEmails:
    Type: String
    Default: ''
    Description: Comma-separated DTC accounts allowed to administer connections (empty means any signed-in DTC account)
  OperatorSubjects:
    Type: String
    Default: ''
    Description: Comma-separated stable DTC subjects allowed to administer connections
  GoogleOAuthClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID shared by Calendar and YouTube connections
  GoogleOAuthClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Secret of the shared Google OAuth client
  DropboxOAuthClientId:
    Type: String
    Default: ''
    Description: Dropbox app key shared by Dropbox connections
  DropboxOAuthClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Dropbox app secret (also verifies webhook signatures)
  TriggerEmailDomain:
    Type: String
    Default: dtcdev.click
    Description: Domain for operator-created email trigger addresses
  EmailSender:
    Type: String
    Default: no-reply@dtcdev.click
    Description: From address for email_send workflow actions (must be SES-verified)
  GithubWorkflowsTokenSecret:
    Type: String
    Default: ''
    Description: >
      Secrets Manager secret name holding a GitHub token (Contents: read/write
      on the workflows repo). Set to let the console designer commit
      workflows/*.yaml straight to the repo; empty disables designer saves.

Conditions:
  HasGithubWorkflowsToken: !Not [!Equals [!Ref GithubWorkflowsTokenSecret, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        EVENT_QUEUE_URL: !Ref EventQueue
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        CREDENTIALS_TABLE: !Ref CredentialsTable
        CURSORS_TABLE: !Ref CursorsTable
        EXECUTIONS_TABLE: !Ref ExecutionsTable
        GRANTS_TABLE: !Ref GrantsTable
        AUDIT_TABLE: !Ref AuditTable
        RENDER_QUEUE_URL: !Ref RenderQueue
        RENDER_ARTIFACTS_BUCKET: !Ref RenderArtifactsBucket
        DATAOPS_INTAKE_URL: !Ref DataOpsIntakeUrl
        AUTH_BASE_URL: !Ref AuthBaseUrl
        AUTH_CLIENT_ID: !Ref AuthClientId
        AUTH_CLI_CLIENT_ID: !Ref AuthCliClientId
        AUTH_CALLBACK_URL: !Sub https://${DomainName}/auth/callback
        AUTH_LOGOUT_URL: !Sub https://${DomainName}/
        OAUTH_CALLBACK_URL: !Sub https://${DomainName}/oauth/callback
        AUTH_ISSUER: !Ref AuthIssuer
        AUTH_JWKS_URL: !Ref AuthJwksUrl
        OPERATOR_EMAILS: !Ref OperatorEmails
        OPERATOR_SUBJECTS: !Ref OperatorSubjects
        TRIGGER_EMAIL_DOMAIN: !Ref TriggerEmailDomain
        EMAIL_TRIGGERS_TABLE: !Ref EmailTriggersTable
        HOOK_TRIGGERS_TABLE: !Ref HookTriggersTable
        SCHEDULE_TRIGGERS_TABLE: !Ref ScheduleTriggersTable
        API_TOKENS_TABLE: !Ref ApiTokensTable
        HOOKS_BASE_URL: !Sub https://${DomainName}

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [content-type, x-dropbox-signature]
        AllowMethods: [GET, POST]
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref DomainCertificateArn
        EndpointConfiguration: REGIONAL
        Route53:
          HostedZoneId: !Ref HostedZoneId
          EvaluateTargetHealth: false

  IngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.ingress.handler
      Runtime: python3.12
      Architectures: [arm64]
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DropboxQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref YouTubeWebhookSecret
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DapierAdminSecret
        - !If
          - HasGithubWorkflowsToken
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GithubWorkflowsTokenSecret}*
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem]
            Resource: !GetAtt CredentialsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref ExecutionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GrantsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailTriggersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HookTriggersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduleTriggersTable
        - Statement:
            Effect: Allow
            Action: [events:PutRule, events:PutTargets, events:DeleteRule,
                     events:RemoveTargets, events:DescribeRule]
            Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/dapier-schedule-*
      Environment:
        Variables:
          YOUTUBE_WEBHOOK_SECRET_ID: !Ref YouTubeWebhookSecret
          ADMIN_SECRET_ID: !Ref DapierAdminSecret
          GITHUB_WORKFLOWS_TOKEN_SECRET: !Ref GithubWorkflowsTokenSecret
          WORKER_FUNCTION_ARN: !GetAtt WorkerFunction.Arn
          DROPBOX_QUEUE_URL: !Ref DropboxQueue
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          DROPBOX_OAUTH_CLIENT_ID: !Ref DropboxOAuthClientId
          DROPBOX_OAUTH_CLIENT_SECRET: !Ref DropboxOAuthClientSecret
      Events:
        Root:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /, Method: GET}
        ConsoleWorkflows:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /workflows, Method: GET}
        ConsoleConnections:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /connections, Method: GET}
        ConsoleCredentials:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /credentials, Method: GET}
        ConsoleRuns:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /runs, Method: GET}
        AppCss:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /assets/app.css, Method: GET}
        AppJs:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /assets/app.js, Method: GET}
        LucideJs:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /assets/lucide.min.js, Method: GET}
        DesignerView:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /designer, Method: GET}
        DesignerJs:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /assets/designer.js, Method: GET}
        DesignerCss:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /assets/designer.css, Method: GET}
        AdminApi:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/admin/{proxy+}', Method: ANY}
        AgentApi:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/api/agent/{proxy+}', Method: ANY}
        OAuthCallback:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /oauth/callback, Method: GET}
        AuthLogin:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /auth/login, Method: GET}
        AuthCallback:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /auth/callback, Method: GET}
        AuthError:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /auth/error, Method: GET}
        AuthLogout:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /auth/logout, Method: GET}
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /health, Method: GET}
        CustomHook:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/hooks/custom/{source}'
            Method: POST
        DropboxGet:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /hooks/dropbox, Method: GET}
        DropboxPost:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /hooks/dropbox, Method: POST}
        YouTubeGet:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /hooks/youtube, Method: GET}
        YouTubePost:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /hooks/youtube, Method: POST}
        WebhookTriggerHook:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/hooks/webhook/{proxy+}'
            Method: POST
        TelegramTriggerHook:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/hooks/telegram/{proxy+}'
            Method: POST

  # Standalone (not inline) because the grant exists only when the token
  # secret is configured; AWS::NoValue inside the function's Policies list
  # does not survive SAM's template transform.
  DesignerGithubTokenPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGithubWorkflowsToken
    Properties:
      PolicyName: dapier-designer-github-token-read
      Roles: [!Ref IngressFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GithubWorkflowsTokenSecret}*

  EmailIngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: email_ingress.handler
      Runtime: python3.12
      Architectures: [arm64]
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName
        - S3ReadPolicy:
            BucketName: !Sub ${AWS::StackName}-mail-${AWS::AccountId}
      Events:
        MailStored:
          Type: S3
          Properties:
            Bucket: !Ref MailBucket
            Events: s3:ObjectCreated:*

  YouTubeSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.youtube_subscriptions.handler
      Runtime: python3.12
      Architectures: [arm64]
      Environment:
        Variables:
          YOUTUBE_CALLBACK_URL: !Sub https://${DomainName}/hooks/youtube
          YOUTUBE_WEBHOOK_SECRET_ID: !Ref YouTubeWebhookSecret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref YouTubeWebhookSecret
      Events:
        Renewal:
          Type: Schedule
          Properties:
            Schedule: rate(5 days)

  YouTubeWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: WebSub callback signing secret for Dapier YouTube notifications
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  DapierAdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${AWS::StackName}/admin
      Description: Signing key for Dapier console session cookies
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.worker.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          DROPBOX_OAUTH_CLIENT_ID: !Ref DropboxOAuthClientId
          DROPBOX_OAUTH_CLIENT_SECRET: !Ref DropboxOAuthClientSecret
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          DAPIER_EMAIL_SENDER: !Ref EmailSender
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy: {SecretArn: '*'}
        - Statement:
            Effect: Allow
            Action: [ses:SendEmail]
            Resource: '*'
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem]
            Resource: !GetAtt CredentialsTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EmailTriggersTable
        - DynamoDBReadPolicy:
            TableName: !Ref HookTriggersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ScheduleTriggersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RenderQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ExecutionsTable
        - S3CrudPolicy:
            BucketName: !Ref RenderArtifactsBucket
        - S3ReadPolicy:
            BucketName: !Ref DatamailerInboundBucketName
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Standalone (not inline) because schedule rules are created and deleted at
  # runtime; the permission is provisioned once for the whole rule family so
  # trigger saves only ever call the Events API.
  ScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/dapier-schedule-*

  DropboxResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.dropbox_resolver.handler
      Runtime: python3.12
      Architectures: [arm64]
      Timeout: 120
      MemorySize: 256
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CursorsTable
        - Statement:
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem]
            Resource: !GetAtt CredentialsTable.Arn
      Environment:
        Variables:
          DROPBOX_OAUTH_CLIENT_ID: !Ref DropboxOAuthClientId
          DROPBOX_OAUTH_CLIENT_SECRET: !Ref DropboxOAuthClientSecret
      Events:
        Notifications:
          Type: SQS
          Properties:
            Queue: !GetAtt DropboxQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  EventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDatamailerInboundEvents
            Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt EventQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref InboundEmailTopicArn

  DeadLetterQueue:
    Type: AWS::SQS::Queue

  DropboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DropboxDeadLetterQueue.Arn
        maxReceiveCount: 5

  DropboxDeadLetterQueue:
    Type: AWS::SQS::Queue

  RenderQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RenderDeadLetterQueue.Arn
        maxReceiveCount: 3

  RenderDeadLetterQueue:
    Type: AWS::SQS::Queue

  EventDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dapier events are waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DropboxDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dropbox notifications are waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DropboxDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RenderDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTML render jobs are waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RenderDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dapier workflow worker Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  HtmlRendererFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref HtmlRendererImageUri
      ImageConfig:
        Command: [banner_generator.html_renderer_handler.handler]
      Timeout: 180
      MemorySize: 2048
      Architectures: [x86_64]
      Environment:
        Variables:
          HTML_RENDERER_COMPLETION_QUEUE_URL: !Ref EventQueue
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref RenderArtifactsBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventQueue.QueueName
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt RenderQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: connection_id, AttributeType: S}
      KeySchema:
        - {AttributeName: connection_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  CredentialsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: credential_id, AttributeType: S}
      KeySchema:
        - {AttributeName: credential_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  CursorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: cursor_id, AttributeType: S}
      KeySchema:
        - {AttributeName: cursor_id, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  ExecutionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: execution_id, AttributeType: S}
      KeySchema:
        - {AttributeName: execution_id, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  GrantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: connection_id, AttributeType: S}
        - {AttributeName: grantee, AttributeType: S}
      KeySchema:
        - {AttributeName: connection_id, KeyType: HASH}
        - {AttributeName: grantee, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: audit_id, AttributeType: S}
      KeySchema:
        - {AttributeName: audit_id, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  EmailTriggersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: name, AttributeType: S}
      KeySchema:
        - {AttributeName: name, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  HookTriggersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: hook_id, AttributeType: S}
      KeySchema:
        - {AttributeName: hook_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  ScheduleTriggersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: schedule_id, AttributeType: S}
      KeySchema:
        - {AttributeName: schedule_id, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  ApiTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: token_hash, AttributeType: S}
      KeySchema:
        - {AttributeName: token_hash, KeyType: HASH}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-mail-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-mail
            Status: Enabled
            ExpirationInDays: 30

  RenderArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: expire-render-artifacts
            Status: Enabled
            ExpirationInDays: 30

Outputs:
  ApiUrl:
    Value: !Sub https://${DomainName}
  MailBucketName:
    Value: !Ref MailBucket
  EmailIngressFunctionArn:
    Value: !GetAtt EmailIngressFunction.Arn
  EventQueueUrl:
    Value: !Ref EventQueue
  RenderQueueUrl:
    Value: !Ref RenderQueue
  RenderArtifactsBucketName:
    Value: !Ref RenderArtifactsBucket
  YouTubeSubscriptionFunctionName:
    Value: !Ref YouTubeSubscriptionFunction
  AdminSecretName:
    Value: !Ref DapierAdminSecret
  CredentialsTableName:
    Value: !Ref CredentialsTable
  CredentialsTableArn:
    Value: !GetAtt CredentialsTable.Arn
  GrantsTableName:
    Value: !Ref GrantsTable
  CursorsTableName:
    Value: !Ref CursorsTable
  AuditTableName:
    Value: !Ref AuditTable
