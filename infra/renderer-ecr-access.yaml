AWSTemplateFormatVersion: '2010-09-09'
Description: Repository-scoped ECR permissions required to deploy the Dapier renderer Lambda image.

Resources:
  GithubDeployRendererImageAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DapierRendererImageAccess
      Roles:
        - dapier-github-actions-deploy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/dapier-html-renderer

  CloudFormationDeployRendererImageAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DapierRendererImageAccess
      Roles:
        - dapier-cloudformation-service
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/dapier-html-renderer
